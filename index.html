<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2939; --muted:#667085; --line:#e4e7ec;
          --c1:#1f3a5f; --c2:#2e8b8b; --c3:#d98e04; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101828; --card:#1d2939; --text:#f2f4f7; --muted:#98a2b3; --line:#344054;
            --c1:#6ea8fe; --c2:#4fd1c5; --c3:#f6ad55; --bad:#fc8181; }
  }
  :root[data-theme="dark"] { --bg:#101828; --card:#1d2939; --text:#f2f4f7; --muted:#98a2b3; --line:#344054;
          --c1:#6ea8fe; --c2:#4fd1c5; --c3:#f6ad55; --bad:#fc8181; }
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-size:26px; }
  #theme { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  #theme:hover { border-color:var(--muted); }
  .sub { color:var(--muted); margin:4px 0 20px; font-size:13px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .tile, .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .tile .v { font-size:30px; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-bottom:12px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .chart { position:relative; height:260px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:6px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  tfoot td { font-weight:700; }
  #err { display:none; background:#fef3f2; color:#b42318; padding:12px; border-radius:8px; margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Asset Dashboard</h1>
    <button id="theme" type="button" aria-label="Toggle dark mode"></button>
  </div>
  <p class="sub" id="sub">Loading…</p>
  <div id="err"></div>
  <div class="tiles" id="tiles"></div>
  <div class="grid">
    <div class="card"><h2>Assets by OS</h2><div class="chart"><canvas id="c1" role="img" aria-label="Assets by OS: total, active and EDR installed"></canvas></div></div>
    <div class="card"><h2>OS share of total assets</h2><div class="chart"><canvas id="c2" role="img" aria-label="OS share of total assets"></canvas></div></div>
  </div>
  <div class="grid">
    <div class="card"><h2>EDR coverage by OS</h2><div class="chart"><canvas id="c3" role="img" aria-label="EDR installed versus missing by OS"></canvas></div></div>
    <div class="card"><h2>Endpoints last seen, by month</h2><div class="chart"><canvas id="c4" role="img" aria-label="Endpoints last seen per month"></canvas></div></div>
  </div>
  <div class="card">
    <h2>Assets by OS (endpoints + servers)</h2>
    <table id="tbl"></table>
  </div>
</main>
<script>
const FILES = ['endpoints.csv', 'servers.csv'];
const OS = [['Windows','Windows','Windows Server'],['macOS','macOS','macOS'],['Linux','Linux','Linux']];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function loadCsv(file) {
  const res = await fetch(file + '?t=' + Date.now());
  if (!res.ok) throw new Error('Could not load ' + file + ' (HTTP ' + res.status + ')');
  const wb = XLSX.read(await res.text(), { type: 'string', raw: true });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null, raw: true })
    .map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.trim(), typeof v === 'string' ? v.trim() : v])))
    .filter(r => r['Asset ID']);
}
// Accepts 2026-10-12, 12/10/2026, 12-Oct-2026, 12/Oct/26
function parseDate(v) {
  if (v == null || v === '') return null;
  let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v))) return new Date(+m[1], m[2] - 1, +m[3]);
  if ((m = /^(\d{1,2})[\/-]([A-Za-z]{3})[a-z]*[\/-](\d{2,4})$/.exec(v))) {
    const mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase());
    return mo < 0 ? null : new Date(m[3].length === 2 ? 2000 + +m[3] : +m[3], mo, +m[1]);
  }
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v))) return new Date(+m[3], m[2] - 1, +m[1]);
  return null;
}
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function syncButton() { document.getElementById('theme').textContent = isDark() ? '☀ Light mode' : '☾ Dark mode'; }
try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') root.dataset.theme = t; } catch (e) {}
let redraw = null;
document.getElementById('theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  root.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncButton(); if (redraw) redraw();
});
syncButton();

const hasEdr = v => v != null && String(v).trim() !== '' && v !== 'Not Installed';

async function main() {
  const [E, S] = await Promise.all(FILES.map(loadCsv));

  const stats = OS.map(([label, e, s]) => {
    const te = E.filter(r => r['OS Family'] === e), ts = S.filter(r => r['OS Family'] === s);
    const total = te.length + ts.length;
    const active = te.filter(r => r['Status'] === 'Active').length + ts.filter(r => r['Status'] === 'Active').length;
    const edr = te.filter(r => hasEdr(r['EDR Agent'])).length + ts.filter(r => hasEdr(r['EDR Agent'])).length;
    return { label, total, active, edr, noEdr: total - edr };
  });
  const sum = k => stats.reduce((a, s) => a + s[k], 0);
  const T = { total: sum('total'), active: sum('active'), edr: sum('edr'), noEdr: sum('noEdr') };

  // last 12 months of endpoint Last Seen
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  const seen = months.map(m => E.filter(r => {
    const d = parseDate(r['Last Seen']); return d && d.getFullYear() === m.getFullYear() && d.getMonth() === m.getMonth();
  }).length);
  const monthLabels = months.map(m => m.toLocaleString('en', { month: 'short', year: 'numeric' }));

  document.getElementById('sub').textContent =
    E.length + ' endpoints + ' + S.length + ' servers · read live from ' + FILES.join(' + ') + ' · refreshed ' + now.toLocaleString();

  const tile = (l, v) => '<div class="tile"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';
  document.getElementById('tiles').innerHTML =
    tile('Total assets', T.total) + tile('Active', T.active) + tile('With EDR', T.edr) +
    tile('EDR coverage', T.total ? Math.round(100 * T.edr / T.total) + '%' : '0%') + tile('Without EDR', T.noEdr);

  document.getElementById('tbl').innerHTML =
    '<thead><tr><th>OS</th><th>Total</th><th>Active</th><th>EDR installed</th><th>No EDR</th></tr></thead><tbody>' +
    stats.map(s => '<tr><td>' + s.label + '</td><td>' + s.total + '</td><td>' + s.active + '</td><td>' + s.edr + '</td><td>' + s.noEdr + '</td></tr>').join('') +
    '</tbody><tfoot><tr><td>Total</td><td>' + T.total + '</td><td>' + T.active + '</td><td>' + T.edr + '</td><td>' + T.noEdr + '</td></tr></tfoot>';

  const charts = [];
  redraw = () => {
  charts.splice(0).forEach(c => c.destroy());
  Chart.defaults.color = css('--muted');
  Chart.defaults.borderColor = css('--line');
  const opts = { responsive: true, maintainAspectRatio: false };
  const labels = stats.map(s => s.label);
  charts.push(new Chart('c1', { type: 'bar', options: opts, data: { labels, datasets: [
    { label: 'Total', data: stats.map(s => s.total), backgroundColor: css('--c1') },
    { label: 'Active', data: stats.map(s => s.active), backgroundColor: css('--c2') },
    { label: 'EDR installed', data: stats.map(s => s.edr), backgroundColor: css('--c3') }] } }));
  charts.push(new Chart('c2', { type: 'doughnut', options: opts, data: { labels, datasets: [
    { data: stats.map(s => s.total), backgroundColor: [css('--c1'), css('--c2'), css('--c3')], borderColor: css('--card') }] } }));
  charts.push(new Chart('c3', { type: 'bar', data: { labels, datasets: [
    { label: 'EDR installed', data: stats.map(s => s.edr), backgroundColor: css('--c2') },
    { label: 'No EDR', data: stats.map(s => s.noEdr), backgroundColor: css('--bad') }] },
    options: { ...opts, indexAxis: 'y', scales: { x: { stacked: true }, y: { stacked: true } } } }));
  charts.push(new Chart('c4', { type: 'bar', data: { labels: monthLabels, datasets: [
    { label: 'Endpoints', data: seen, backgroundColor: css('--c1') }] },
    options: { ...opts, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } }));
  };
  redraw();
}
main().catch(e => {
  document.getElementById('sub').textContent = '';
  const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = e.message;
});
</script>
</body>
</html>
